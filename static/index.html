<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="/static/styles.css"/>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Tic Tac Toe</h1>
      <p class="sub">You are X · Computer is O</p>

      <div id="board" class="board"></div>

      <div class="result">
        <span id="status">Your turn</span>
      </div>

      <div class="actions">
        <button id="reset" class="btn danger">Restart</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
